name: Compilar GameUtil

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # sin certificado de firma: los .exe salen sin firmar
      - run: npm run checksums
      - uses: actions/upload-artifact@v4
        with:
          name: GameUtil-windows
          path: |
            dist/GameUtil-Portable-*.exe
            dist/SHA256SUMS.txt
      - name: Publicar en la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GameUtil-Portable-*.exe
            dist/SHA256SUMS.txt
